<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Snowball Showdown 3D</title>
    <link rel="stylesheet" href="styles.css">

    <!--
    SNOWBALL SHOWDOWN 3D
    A first-person 3D snowball shooter game

    HOW TO RUN LOCALLY:
    1. Open this index.html in a browser (Chrome recommended)
    2. Or serve via local server: python3 -m http.server 8000

    HOW TO DEPLOY TO NETLIFY:
    1. Drag and drop this folder to Netlify
    2. No build commands needed - it's a static site

    CONTROLS:
    - Use on-screen joystick to move
    - Drag screen to look around
    - "ROLL SNOWBALL" button when near snow patches
    - "THROW" button when you have a snowball
    - First to 10 hits wins!
    -->
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div id="score-display">
                <div class="score-item">
                    <span class="score-label">YOU</span>
                    <span class="score-value" id="player-score">0</span>
                </div>
                <div class="score-separator">-</div>
                <div class="score-item">
                    <span class="score-value" id="ai-score">0</span>
                    <span class="score-label">AI</span>
                </div>
            </div>

            <div id="snowball-status">No Snowball</div>
            <div id="hit-message"></div>
        </div>

        <!-- Controls -->
        <div id="controls">
            <!-- Movement Joystick -->
            <div id="joystick-container">
                <div id="joystick-base"></div>
                <div id="joystick-stick"></div>
            </div>

            <!-- Action Buttons -->
            <div id="action-buttons">
                <button id="roll-btn" class="action-btn" disabled>ROLL<br>SNOWBALL</button>
                <button id="throw-btn" class="action-btn" disabled>THROW</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden">
            <div class="overlay"></div>
            <div class="game-over-content">
                <h1 id="game-over-title">YOU WIN!</h1>
                <div id="final-score"></div>
                <button id="restart-btn" class="main-btn">PLAY AGAIN</button>
            </div>
        </div>

        <!-- Start Screen -->
        <div id="start-screen">
            <div class="overlay"></div>
            <div class="start-content">
                <h1>❄️ SNOWBALL SHOWDOWN ❄️</h1>
                <p class="instructions">
                    Find snowmen to roll snowballs<br>
                    Camera auto-aims at your opponent<br>
                    <strong>First to 10 hits wins!</strong>
                </p>
                <div class="controls-info">
                    <p>🕹️ Left joystick: Move around</p>
                    <p>👁️ Camera: Auto-tracks opponent</p>
                    <p>🎯 Buttons: Roll & Throw</p>
                </div>
                <button id="start-btn" class="main-btn">START GAME</button>
            </div>
        </div>
    </div>

    <!-- Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

    <!-- Game Code -->
    <script src="game.js"></script>
</body>
</html>
